<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pong Kombat - Mobile Edition</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3232">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon_192.png">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex; justify-content: center; align-items: center;
        }
        #canvas {
            image-rendering: pixelated;
            background-color: #111;
            box-shadow: 0 0 50px rgba(255, 50, 50, 0.3);
            border: 2px solid #333;
        }
        #loading {
            position: absolute;
            display: flex; flex-direction: column; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333; border-top: 5px solid #ff3232;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Ocultar canvas hasta que esté cargado */
        #canvas.hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Cargando Pong Kombat...</p>
    </div>
    
    <!-- El canvas será manejado por Pygbag -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW Registered!', reg))
                    .catch(err => console.log('SW Error:', err));
            });
        }

        // Configuración para Pygbag
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('canvas').classList.remove('hidden');
            }, 2000); // Simulación de carga inicial
        };
    </script>
</body>
</html>
